apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: auth:latest
        imagePullPolicy: Never   # ✅ IMPORTANT FIX (ECR ACCESS)
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URL
          value: mongodb://mongo-service:27017/fooddb